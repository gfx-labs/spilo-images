name: Build and Push Spilo Images

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/spilo

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubicloud-standard-8
    strategy:
      matrix:
        include:
          - pg_version: "16"
            spilo_version: "3.3-p3"
          - pg_version: "17"
            spilo_version: "4.0-p3"
    steps:
      - name: Checkout Spilo repository
        uses: actions/checkout@v4
        with:
          repository: zalando/spilo
          ref: ${{ matrix.spilo_version }}
          path: spilo

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push PostgreSQL ${{ matrix.pg_version }} image
        uses: docker/build-push-action@v5
        with:
          context: ./spilo/postgres-appliance
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.pg_version }}-${{ matrix.spilo_version }}
          build-args: |
            TIMESCALEDB_APACHE_ONLY=false
          cache-from: type=gha,scope=pg${{ matrix.pg_version }}
          cache-to: type=gha,mode=max,scope=pg${{ matrix.pg_version }}
          platforms: linux/amd64,linux/arm64
